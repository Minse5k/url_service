# Render Blueprint: Rust 백엔드(Docker)와 PostgreSQL.
# 대시보드에서 New > Blueprint로 이 저장소를 연결하면 두 리소스를 함께 만든다.
# DATABASE_URL은 Render가 DB에서 직접 주입한다(값을 저장소에 넣지 않음).
services:
  - type: web
    name: url-service-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: url-service-db
          property: connectionString
      - key: BASE_URL
        value: https://url-service.url-service-cloudflare.workers.dev

databases:
  - name: url-service-db
    plan: free
    region: singapore
    databaseName: url_service
    user: url_service
