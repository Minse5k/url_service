# Cloudflare Worker: 화면(정적 자산) + `/숫자`·`/api/*` 프록시.
# `public/`은 `scripts/build-cloudflare.sh`가 만든다(저장소에는 넣지 않음).
name = "url-service"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
# 모든 요청을 먼저 Worker가 받아서 `/숫자`가 정적 자산 404로 새지 않게 한다.
run_worker_first = true
not_found_handling = "404-page"

[vars]
# Railway 백엔드의 공개 주소. 비밀값이 아니다(DB 접속 정보는 Railway에만 있다).
BACKEND_URL = "https://url-service-production.up.railway.app"
