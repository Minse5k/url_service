[workspace]
resolver = "3"
members = ["crates/web", "crates/core", "crates/storage"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
dioxus = "0.7.10"
url-core = { path = "crates/core" }
url-storage = { path = "crates/storage" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rand = "0.10"
